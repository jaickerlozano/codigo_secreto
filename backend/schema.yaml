openapi: 3.0.3
info:
  title: Código Secreto Management API
  version: 1.0.0
  description: API for managing products, suppliers, and categories in the Código
    Secreto inventory system.
paths:
  /api/auth/csrf/:
    get:
      operationId: auth_csrf_retrieve
      description: Endpoint público que genera y establece la cookie CSRF para clientes
        de navegador.
      summary: Semilla de cookie CSRF
      tags:
      - Autenticación
      security:
      - {}
      responses:
        '204':
          description: No response body
  /api/auth/login/:
    post:
      operationId: auth_login_create
      description: Recibe el correo electrónico y la contraseña. Establece cookies
        HttpOnly de acceso y refresco, y devuelve un mensaje sin exponer tokens.
      summary: Iniciar sesión (Login)
      tags:
      - Autenticación
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenObtainPair'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TokenObtainPair'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TokenObtainPair'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenObtainPair'
          description: ''
  /api/auth/logout/:
    post:
      operationId: auth_logout_create
      description: Elimina las cookies HttpOnly del token de acceso y refresco.
      summary: Cerrar sesión (Logout)
      tags:
      - Autenticación
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
          description: ''
  /api/auth/me/:
    get:
      operationId: auth_me_retrieve
      description: Lee el token JWT enviado en las cabeceras y devuelve los datos
        personales del usuario conectado.
      summary: Obtener perfil del usuario autenticado
      tags:
      - Autenticación
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserMe'
          description: ''
  /api/auth/me/phone/:
    patch:
      operationId: auth_me_phone_partial_update
      description: Valida y normaliza el teléfono móvil chileno usado para el checkout.
      summary: Actualizar teléfono del perfil autenticado
      tags:
      - Autenticación
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedProfilePhone'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedProfilePhone'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedProfilePhone'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserMe'
          description: ''
  /api/auth/register/:
    post:
      operationId: auth_register_create
      description: Permite a los usuarios de la tienda crear una cuenta de cliente.
        Crea el usuario y su perfil de despacho de forma automática.
      summary: Registrar un nuevo cliente
      tags:
      - Autenticación
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Register'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Register'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Register'
        required: true
      security:
      - {}
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Register'
          description: ''
  /api/auth/token/refresh/:
    post:
      operationId: auth_token_refresh_create
      description: Lee el token de refresco desde la cookie HttpOnly, requiere CSRF,
        y renueva la cookie de acceso sin devolver tokens en el body.
      summary: Refrescar token de acceso
      tags:
      - Autenticación
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenRefresh'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TokenRefresh'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TokenRefresh'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenRefresh'
          description: ''
  /api/cart/me/:
    get:
      operationId: cart_me_retrieve
      description: Devuelve el carrito del usuario con subtotales, envío y total;
        con ?comuna={id} el envío usa la autoridad de precios del backend.
      summary: Ver mi carrito de compras
      parameters:
      - in: query
        name: comuna
        schema:
          type: integer
        description: ID de la comuna de entrega para el estimado de envío autoritativo.
      tags:
      - Carrito
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Cart'
          description: ''
    post:
      operationId: cart_me_create
      description: Recibe un product_id y la cantidad. Si el producto ya está en el
        carro, suma la cantidad; si no, lo añade.
      summary: Añadir o actualizar producto en el carrito
      tags:
      - Carrito
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddToCart'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AddToCart'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AddToCart'
        required: true
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Cart'
          description: ''
    delete:
      operationId: cart_me_destroy
      description: Recibe un product_id y la cantidad a quitar. Si la cantidad del
        carro llega a cero o menos, el ítem se elimina por completo.
      summary: Remover o disminuir producto del carrito
      parameters:
      - in: query
        name: product_id
        schema:
          type: integer
        required: true
      - in: query
        name: quantity
        schema:
          type: integer
        required: true
      tags:
      - Carrito
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Cart'
          description: ''
  /api/categories/:
    get:
      operationId: categories_list
      parameters:
      - name: page
        required: false
        in: query
        description: Un número de página dentro del conjunto de resultados paginado.
        schema:
          type: integer
      - name: search
        required: false
        in: query
        description: Un término de búsqueda.
        schema:
          type: string
      tags:
      - categories
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedCategoryList'
          description: ''
    post:
      operationId: categories_create
      tags:
      - categories
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Category'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Category'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Category'
        required: true
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Category'
          description: ''
  /api/categories/{id}/:
    get:
      operationId: categories_retrieve
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: Un valor de entero único que identifique este Categoría.
        required: true
      tags:
      - categories
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Category'
          description: ''
    put:
      operationId: categories_update
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: Un valor de entero único que identifique este Categoría.
        required: true
      tags:
      - categories
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Category'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Category'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Category'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Category'
          description: ''
    patch:
      operationId: categories_partial_update
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: Un valor de entero único que identifique este Categoría.
        required: true
      tags:
      - categories
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedCategory'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedCategory'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedCategory'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Category'
          description: ''
    delete:
      operationId: categories_destroy
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: Un valor de entero único que identifique este Categoría.
        required: true
      tags:
      - categories
      responses:
        '204':
          description: No response body
  /api/contact/:
    post:
      operationId: contact_create
      description: Endpoint público para enviar mensajes de contacto.
      summary: Enviar mensaje de contacto
      tags:
      - Contacto
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ContactMessage'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ContactMessage'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ContactMessage'
        required: true
      security:
      - {}
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContactMessageResponse'
          description: ''
  /api/favorites/:
    get:
      operationId: favorites_list
      description: Favoritos privados del cliente autenticado (lectura y merge de
        invitado).
      summary: Listar favoritos del usuario autenticado
      tags:
      - Favoritos
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Favorite'
          description: ''
    post:
      operationId: favorites_create
      description: Favoritos privados del cliente autenticado (lectura y merge de
        invitado).
      summary: Fusionar favoritos de invitado (sin duplicados)
      tags:
      - Favoritos
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FavoriteMerge'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/FavoriteMerge'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/FavoriteMerge'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Favorite'
          description: ''
  /api/favorites/{product_id}/:
    delete:
      operationId: favorites_destroy
      description: Elimina un favorito del cliente autenticado.
      summary: Eliminar un favorito por producto
      parameters:
      - in: path
        name: product_id
        schema:
          type: integer
        required: true
      tags:
      - Favoritos
      responses:
        '204':
          description: No response body
  /api/orders/:
    get:
      operationId: orders_list
      parameters:
      - name: page
        required: false
        in: query
        description: Un número de página dentro del conjunto de resultados paginado.
        schema:
          type: integer
      tags:
      - orders
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedOrderList'
          description: ''
    post:
      operationId: orders_create
      parameters:
      - in: header
        name: Idempotency-Key
        schema:
          type: string
        description: Clave de idempotencia del checkout (máx. 64 caracteres).
      tags:
      - orders
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrderCreate'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/OrderCreate'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/OrderCreate'
        required: true
      security:
      - {}
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QuoteRevisionStale'
          description: ''
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QuoteError'
          description: ''
  /api/orders/{id}/:
    get:
      operationId: orders_retrieve
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: Un valor de entero único que identifique este Pedido.
        required: true
      tags:
      - orders
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
          description: ''
  /api/orders/by-order-number/{order_number}/:
    get:
      operationId: orders_by_order_number_retrieve
      description: |-
        Endpoint seguro para consultar una orden por order_number.
        Requiere propietario, staff o cookie de capacidad válida.
      parameters:
      - in: path
        name: order_number
        schema:
          type: string
          title: Número de pedido
          description: 'Identificador público del pedido (ej: CS-XXXXXXX).'
        required: true
      tags:
      - orders
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
          description: ''
  /api/orders/by-order-number/{order_number}/access/:
    post:
      operationId: orders_by_order_number_access_create
      parameters:
      - in: header
        name: X-Order-Capability
        schema:
          type: string
        required: true
      - in: path
        name: order_number
        schema:
          type: string
          title: Número de pedido
          description: 'Identificador público del pedido (ej: CS-XXXXXXX).'
        required: true
      tags:
      - orders
      security:
      - {}
      responses:
        '204':
          description: No response body
  /api/orders/by-order-number/{order_number}/cancel/:
    post:
      operationId: orders_by_order_number_cancel_create
      parameters:
      - in: header
        name: X-Order-Capability
        schema:
          type: string
      - in: path
        name: order_number
        schema:
          type: string
          title: Número de pedido
          description: 'Identificador público del pedido (ej: CS-XXXXXXX).'
        required: true
      tags:
      - orders
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
          description: ''
        '404':
          description: No response body
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QuoteError'
          description: ''
  /api/orders/quote/:
    post:
      operationId: orders_quote_create
      tags:
      - orders
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Quote'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Quote'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Quote'
        required: true
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GuestQuoteResponse'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QuoteError'
          description: ''
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QuoteError'
          description: ''
  /api/payments/{transaction_id}/mock-approve/:
    post:
      operationId: payments_mock_approve_create
      description: Aprueba la transacción mock pendiente y marca el pedido como pagado.
      summary: Aprobar pago mock (solo desarrollo)
      parameters:
      - in: path
        name: transaction_id
        schema:
          type: integer
        required: true
      tags:
      - Pagos
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MockApproveResponse'
          description: ''
  /api/payments/initiate/:
    post:
      operationId: payments_initiate_create
      description: Recibe el order_id, registra el intento mock y devuelve la URL
        de pago.
      summary: Iniciar proceso de pago
      parameters:
      - in: header
        name: Idempotency-Key
        schema:
          type: string
        description: Clave de idempotencia del intento de pago (máx. 64 caracteres).
      tags:
      - Pagos
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InitiatePayment'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/InitiatePayment'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/InitiatePayment'
        required: true
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InitiatePaymentResponse'
          description: ''
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SpecialDeliveryAgreementRequiredError'
          description: ''
  /api/products/:
    get:
      operationId: products_list
      parameters:
      - in: query
        name: category
        schema:
          type: array
          items:
            type: integer
        description: Múltiples valores separados por comas.
        explode: false
        style: form
      - in: query
        name: experience_level
        schema:
          type: array
          items:
            type: integer
        description: Múltiples valores separados por comas.
        explode: false
        style: form
      - in: query
        name: experience_level__gte
        schema:
          type: integer
      - in: query
        name: experience_level__lte
        schema:
          type: integer
      - in: query
        name: max_price
        schema:
          type: string
      - in: query
        name: min_price
        schema:
          type: string
      - name: ordering
        required: false
        in: query
        description: Qué campo usar para ordenar los resultados.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: Un número de página dentro del conjunto de resultados paginado.
        schema:
          type: integer
      - name: search
        required: false
        in: query
        description: Un término de búsqueda.
        schema:
          type: string
      - in: query
        name: sku
        schema:
          type: string
      - in: query
        name: supplier
        schema:
          type: integer
      tags:
      - products
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedProductList'
          description: ''
    post:
      operationId: products_create
      description: Crear un producto y registrar un movimiento de stock inicial si
        se proporciona current_stock
      tags:
      - products
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Product'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Product'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Product'
        required: true
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
          description: ''
  /api/products/{id}/:
    get:
      operationId: products_retrieve
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: Un valor de entero único que identifique este Producto.
        required: true
      tags:
      - products
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
          description: ''
    put:
      operationId: products_update
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: Un valor de entero único que identifique este Producto.
        required: true
      tags:
      - products
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Product'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Product'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Product'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
          description: ''
    patch:
      operationId: products_partial_update
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: Un valor de entero único que identifique este Producto.
        required: true
      tags:
      - products
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedProduct'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedProduct'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedProduct'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
          description: ''
    delete:
      operationId: products_destroy
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: Un valor de entero único que identifique este Producto.
        required: true
      tags:
      - products
      responses:
        '204':
          description: No response body
  /api/shipping/comunas/:
    get:
      operationId: shipping_comunas_list
      description: Devuelve comunas activas con costo de envío positivo, aptas para
        cotizar y despachar.
      summary: Listar todas las comunas de Chile sueltas
      parameters:
      - in: query
        name: region
        schema:
          type: integer
      tags:
      - Despachos
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Comuna'
          description: ''
  /api/shipping/comunas/{id}/:
    get:
      operationId: shipping_comunas_retrieve
      description: Devuelve comunas activas con costo de envío positivo, aptas para
        cotizar y despachar.
      summary: Listar todas las comunas de Chile sueltas
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: Un valor de entero único que identifique este Comuna.
        required: true
      tags:
      - Despachos
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Comuna'
          description: ''
  /api/shipping/dispatch-options/:
    get:
      operationId: shipping_dispatch_options_retrieve
      description: 'Devuelve metadatos de despacho para una comuna elegible: para
        Santiago, las próximas cuatro fechas de martes/jueves; fuera de Santiago,
        el perfil regional si existe uno único. El precio se cotiza exclusivamente
        desde el costo de la comuna.'
      summary: Opciones de despacho para una comuna
      parameters:
      - in: query
