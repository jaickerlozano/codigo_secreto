          description: ''
    post:
      operationId: stock_movements_create
      description: Crear un movimiento de stock
      tags:
      - stock-movements
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StockMovement'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/StockMovement'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/StockMovement'
        required: true
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StockMovement'
          description: ''
  /api/stock-movements/{id}/:
