openapi: 3.0.3
info:
  title: Código Secreto Management API
  version: 1.0.0
  description: API for managing products, suppliers, and categories in the Código
    Secreto inventory system.
paths:
  /api/auth/login/:
    post:
      operationId: auth_login_create
      description: Recibe el correo electrónico y la contraseña. Devuelve un token
        de acceso y un token de refresco.
      summary: Iniciar sesión (Login)
      tags:
      - Autenticación
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenObtainPair'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TokenObtainPair'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TokenObtainPair'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenObtainPair'
          description: ''
  /api/auth/logout/:
    post:
      operationId: auth_logout_create
      description: Elimina las cookies HttpOnly del token de acceso y refresco.
      summary: Cerrar sesión (Logout)
      tags:
      - Autenticación
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
          description: ''
  /api/auth/me/:
    get:
      operationId: auth_me_retrieve
      description: Lee el token JWT enviado en las cabeceras y devuelve los datos
        personales del usuario conectado.
      summary: Obtener perfil del usuario autenticado
      tags:
      - Autenticación
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserMe'
          description: ''
  /api/auth/register/:
    post:
      operationId: auth_register_create
      description: Permite a los usuarios de la tienda crear una cuenta de cliente.
        Crea el usuario y su perfil de despacho de forma automática.
      summary: Registrar un nuevo cliente
      tags:
      - Autenticación
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Register'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Register'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Register'
        required: true
      security:
      - {}
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Register'
          description: ''
  /api/auth/token/refresh/:
    post:
      operationId: auth_token_refresh_create
      description: Recibe un token de refresco válido y entrega un nuevo token de
        acceso para mantener la sesión activa.
      summary: Refrescar token de acceso
      tags:
      - Autenticación
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenRefresh'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TokenRefresh'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TokenRefresh'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenRefresh'
          description: ''
  /api/cart/me/:
    get:
      operationId: cart_me_retrieve
      description: Devuelve el carrito del usuario conectado con su lista de productos,
        subtotales, envío y total.
      summary: Ver mi carrito de compras
      tags:
      - Carrito
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Cart'
          description: ''
    post:
      operationId: cart_me_create
      description: Recibe un product_id y la cantidad. Si el producto ya está en el
        carro, suma la cantidad; si no, lo añade.
      summary: Añadir o actualizar producto en el carrito
      tags:
      - Carrito
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddToCart'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AddToCart'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AddToCart'
        required: true
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Cart'
          description: ''
    delete:
      operationId: cart_me_destroy
      description: Recibe un product_id y la cantidad a quitar. Si la cantidad del
        carro llega a cero o menos, el ítem se elimina por completo.
      summary: Remover o disminuir producto del carrito
      tags:
      - Carrito
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Cart'
          description: ''
  /api/categories/:
    get:
      operationId: categories_list
      parameters:
      - name: page
        required: false
        in: query
        description: Un número de página dentro del conjunto de resultados paginado.
        schema:
          type: integer
      - name: search
        required: false
        in: query
        description: Un término de búsqueda.
        schema:
          type: string
      tags:
      - categories
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedCategoryList'
          description: ''
    post:
      operationId: categories_create
      tags:
      - categories
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Category'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Category'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Category'
        required: true
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Category'
          description: ''
  /api/categories/{id}/:
    get:
      operationId: categories_retrieve
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: Un valor de entero único que identifique este Categoría.
        required: true
      tags:
      - categories
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Category'
          description: ''
    put:
      operationId: categories_update
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: Un valor de entero único que identifique este Categoría.
        required: true
      tags:
      - categories
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Category'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Category'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Category'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Category'
          description: ''
    patch:
      operationId: categories_partial_update
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: Un valor de entero único que identifique este Categoría.
        required: true
      tags:
      - categories
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedCategory'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedCategory'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedCategory'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Category'
          description: ''
    delete:
      operationId: categories_destroy
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: Un valor de entero único que identifique este Categoría.
        required: true
      tags:
      - categories
      responses:
        '204':
          description: No response body
  /api/orders/:
    get:
      operationId: orders_list
      parameters:
      - name: page
        required: false
        in: query
        description: Un número de página dentro del conjunto de resultados paginado.
        schema:
          type: integer
      tags:
      - orders
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedOrderList'
          description: ''
    post:
      operationId: orders_create
      tags:
      - orders
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Order'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Order'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Order'
        required: true
      security:
      - {}
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
          description: ''
  /api/orders/{id}/:
    get:
      operationId: orders_retrieve
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: Un valor de entero único que identifique este Pedido.
        required: true
      tags:
      - orders
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
          description: ''
  /api/orders/by-order-number/{order_number}/:
    get:
      operationId: orders_by_order_number_retrieve
      description: |-
        Endpoint público para consultar una orden por order_number.
        Permite que guests y usuarios autenticados consulten el estado de su orden.
      parameters:
      - in: path
        name: order_number
        schema:
          type: string
          title: Número de pedido
          description: 'Identificador público del pedido (ej: CS-XXXXXXX).'
        required: true
      tags:
      - orders
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
          description: ''
  /api/orders/track/:
    get:
      operationId: orders_track_retrieve
      description: |-
        Permite a cualquier usuario (incluidos invitados) consultar un pedido
        únicamente por su número de orden público (order_number).
      parameters:
      - in: query
        name: order_number
        schema:
          type: string
        description: 'Número de pedido público (ej: CS-XXXXXXX).'
        required: true
      tags:
      - orders
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
          description: ''
  /api/payments/initiate/:
    post:
      operationId: payments_initiate_create
      description: Recibe el order_id, registra el intento de pago en el backend y
        devuelve la URL de redirección de la pasarela.
      summary: Iniciar proceso de pago
      tags:
      - Pagos
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InitiatePayment'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/InitiatePayment'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/InitiatePayment'
        required: true
      security:
      - {}
      responses:
        '200':
          description: No response body
  /api/products/:
    get:
      operationId: products_list
      parameters:
      - in: query
        name: category
        schema:
          type: integer
      - in: query
        name: experience_level
        schema:
          type: integer
      - in: query
        name: experience_level__gte
        schema:
          type: integer
      - in: query
        name: experience_level__lte
        schema:
          type: integer
      - in: query
        name: max_price
        schema:
          type: string
      - in: query
        name: min_price
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: Un número de página dentro del conjunto de resultados paginado.
        schema:
          type: integer
      - name: search
        required: false
        in: query
        description: Un término de búsqueda.
        schema:
          type: string
      - in: query
        name: supplier
        schema:
          type: integer
      tags:
      - products
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedProductList'
          description: ''
    post:
      operationId: products_create
      description: Crear un producto y registrar un movimiento de stock inicial si
        se proporciona current_stock
      tags:
      - products
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Product'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Product'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Product'
        required: true
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
          description: ''
  /api/products/{id}/:
    get:
      operationId: products_retrieve
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: Un valor de entero único que identifique este Producto.
        required: true
      tags:
      - products
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
          description: ''
    put:
      operationId: products_update
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: Un valor de entero único que identifique este Producto.
        required: true
      tags:
      - products
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Product'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Product'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Product'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
          description: ''
    patch:
      operationId: products_partial_update
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: Un valor de entero único que identifique este Producto.
        required: true
      tags:
      - products
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedProduct'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedProduct'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedProduct'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
          description: ''
    delete:
      operationId: products_destroy
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: Un valor de entero único que identifique este Producto.
        required: true
      tags:
      - products
      responses:
        '204':
          description: No response body
  /api/shipping/comunas/:
    get:
      operationId: shipping_comunas_list
      description: Devuelve el listado plano de todas las comunas de Chile. Permite
        ver sus costos de despacho individuales.
      summary: Listar todas las comunas de Chile sueltas
      parameters:
      - name: page
        required: false
        in: query
        description: Un número de página dentro del conjunto de resultados paginado.
        schema:
          type: integer
      - in: query
        name: region
        schema:
          type: integer
      tags:
      - Despachos
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedComunaList'
          description: ''
  /api/shipping/comunas/{id}/:
    get:
      operationId: shipping_comunas_retrieve
      description: Devuelve el listado plano de todas las comunas de Chile. Permite
        ver sus costos de despacho individuales.
      summary: Listar todas las comunas de Chile sueltas
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: Un valor de entero único que identifique este Comuna.
        required: true
      tags:
      - Despachos
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Comuna'
          description: ''
  /api/shipping/regions/:
    get:
      operationId: shipping_regions_list
      description: Devuelve el listado completo de las 16 regiones oficiales ordenadas
        de Norte a Sur, incluyendo sus comunas activas de forma anidada.
      summary: Listar regiones de Chile con sus comunas
      parameters:
      - name: page
        required: false
        in: query
        description: Un número de página dentro del conjunto de resultados paginado.
        schema:
          type: integer
      tags:
      - Despachos
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedRegionList'
          description: ''
  /api/shipping/regions/{id}/:
    get:
      operationId: shipping_regions_retrieve
      description: Devuelve el listado completo de las 16 regiones oficiales ordenadas
        de Norte a Sur, incluyendo sus comunas activas de forma anidada.
      summary: Listar regiones de Chile con sus comunas
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: Un valor de entero único que identifique este Región.
        required: true
      tags:
      - Despachos
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Region'
          description: ''
