        name: id
        schema:
          type: integer
        description: Un valor de entero único que identifique este Proveedor.
        required: true
      tags:
      - suppliers
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Supplier'
          description: ''
    put:
      operationId: suppliers_update
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: Un valor de entero único que identifique este Proveedor.
        required: true
      tags:
      - suppliers
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Supplier'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Supplier'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Supplier'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Supplier'
          description: ''
    patch:
      operationId: suppliers_partial_update
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: Un valor de entero único que identifique este Proveedor.
        required: true
      tags:
      - suppliers
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedSupplier'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedSupplier'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedSupplier'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Supplier'
          description: ''
    delete:
      operationId: suppliers_destroy
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: Un valor de entero único que identifique este Proveedor.
        required: true
      tags:
      - suppliers
      responses:
        '204':
          description: No response body
components:
  schemas:
    AddToCart:
      type: object
      properties:
        product_id:
          type: integer
        quantity:
          type: integer
          minimum: 1
      required:
      - product_id
      - quantity
    Cart:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
          title: Fecha de creación
        updated_at:
          type: string
          format: date-time
          readOnly: true
          title: Fecha de actualización
        items:
          type: array
          items:
            $ref: '#/components/schemas/CartItem'
          readOnly: true
        monto_total_final:
          type: integer
          readOnly: true
        subtotal:
          type: integer
          readOnly: true
        shipping_cost:
          type: integer
          readOnly: true
        total:
          type: integer
          readOnly: true
        free_shipping_progress:
          type: number
          readOnly: true
        free_shipping_threshold:
          type: integer
          readOnly: true
      required:
      - created_at
      - free_shipping_progress
      - free_shipping_threshold
      - id
      - items
      - monto_total_final
      - shipping_cost
      - subtotal
      - total
      - updated_at
    CartItem:
      type: object
      properties:
        cart:
          type: integer
          title: Carro
        product:
          allOf:
