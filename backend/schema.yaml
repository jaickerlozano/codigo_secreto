components:
  schemas:
    AddToCart:
      type: object
      properties:
        product_id:
          type: integer
        quantity:
          type: integer
          minimum: 1
      required:
      - product_id
      - quantity
    Cart:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
          title: Fecha de creación
        updated_at:
          type: string
          format: date-time
          readOnly: true
          title: Fecha de actualización
        items:
          type: array
          items:
            $ref: '#/components/schemas/CartItem'
          readOnly: true
        monto_total_final:
          type: integer
          readOnly: true
        subtotal:
          type: integer
          readOnly: true
        shipping_cost:
          type: integer
          nullable: true
          readOnly: true
        total:
          type: integer
          nullable: true
          readOnly: true
        free_shipping_progress:
          type: number
          readOnly: true
        free_shipping_threshold:
          type: integer
          readOnly: true
      required:
      - created_at
      - free_shipping_progress
      - free_shipping_threshold
      - id
      - items
      - monto_total_final
      - shipping_cost
      - subtotal
      - total
      - updated_at
    CartItem:
      type: object
      properties:
        cart:
          type: integer
          title: Carro
        product:
          allOf:
          - $ref: '#/components/schemas/Product'
          readOnly: true
        quantity:
          type: integer
          maximum: 9223372036854775807
          minimum: 0
          format: int64
          title: Cantidad
        subtotal:
          type: integer
          readOnly: true
      required:
      - cart
      - product
      - subtotal
    Category:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          title: Nombre
          maxLength: 255
        description:
          type: string
          nullable: true
          title: Descripción
        parent:
          type: integer
          nullable: true
          title: Categoría padre
        subcategories:
          type: string
          readOnly: true
      required:
      - id
      - name
      - subcategories
    Comuna:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          title: Nombre
          maxLength: 100
        shipping_cost:
          type: integer
          maximum: 9223372036854775807
          minimum: 0
          format: int64
          title: Costo de envío
          description: Costo de envío en CLP para esta comuna
        is_active:
          type: boolean
          description: Indica si realizamos envíos a esta comuna
      required:
      - id
      - name
    ContactMessage:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          title: Nombre
          maxLength: 120
        email:
          type: string
          format: email
          title: Correo electrónico
          maxLength: 254
        subject:
          type: string
          title: Asunto
          maxLength: 200
        body:
          type: string
          title: Mensaje
        status:
          allOf:
          - $ref: '#/components/schemas/ContactMessageStatusEnum'
          readOnly: true
          title: Estado
        created_at:
          type: string
          format: date-time
          readOnly: true
          title: Fecha de envío
      required:
      - body
      - created_at
      - email
      - id
      - name
      - status
      - subject
    ContactMessageResponse:
      type: object
      properties:
        id:
          type: integer
        status:
          type: string
      required:
      - id
      - status
    ContactMessageStatusEnum:
      enum:
      - NEW
      - READ
      - RESOLVED
      type: string
      description: |-
        * `NEW` - Nuevo
        * `READ` - Leído
        * `RESOLVED` - Resuelto
    DeliveryKindEnum:
      enum:
      - standard
      - special
      type: string
      description: |-
        * `standard` - Entrega Estándar
        * `special` - Entrega Especial
    DispatchOptions:
      type: object
      description: |-
        Read-only dispatch options for a selected destination comuna.

        Santiago comunas expose the next four future Tuesday/Thursday dates;
        non-Santiago comunas expose the single applicable regional option.
        Exactly one of ``dates``/``shipping_option`` is populated per mode.
      properties:
        comuna_id:
          type: integer
          readOnly: true
        mode:
          allOf:
          - $ref: '#/components/schemas/ModeEnum'
          readOnly: true
        dates:
          type: array
          items:
            type: string
            format: date
          readOnly: true
          nullable: true
        shipping_option:
          allOf:
          - $ref: '#/components/schemas/RegionalDispatchOption'
          readOnly: true
          nullable: true
      required:
      - comuna_id
      - dates
      - mode
      - shipping_option
    Favorite:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        product:
          type: integer
          readOnly: true
          title: Producto
        created_at:
          type: string
          format: date-time
          readOnly: true
          title: Fecha de creación
      required:
      - created_at
      - id
      - product
    FavoriteMerge:
      type: object
      properties:
        product_ids:
          type: array
          items:
            type: integer
            minimum: 1
      required:
      - product_ids
    GuestAccess:
      type: object
      properties:
        token:
          type: string
        expires_at:
          type: string
          format: date-time
      required:
      - expires_at
      - token
    GuestOrderItem:
      type: object
      properties:
        product_id:
          type: integer
          minimum: 1
        quantity:
          type: integer
          minimum: 1
      required:
      - product_id
      - quantity
    GuestQuoteLine:
